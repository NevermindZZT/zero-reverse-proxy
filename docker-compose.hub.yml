services:
  zero-reverse-proxy:
    image: nevermindzzt/zero-reverse-proxy:latest
    container_name: zero-reverse-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ADMIN_USER=admin
      - ADMIN_PASS=admin123
      - CONFIG_PATH=/data/config.json
    volumes:
      - ./data:/data
